<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIND">
<title>ISIONXXX // MIND</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ui.css">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--panel:#0c0c0c;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--dim:#8f8a7e;--amber:#ffb000;--green:#33ff66;--red:#ff4545;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px 48px;background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;outline:0}
button{cursor:pointer;font-size:12px;letter-spacing:.06em}
button:hover,select:hover{border-color:var(--amber);color:var(--amber)}
:focus-visible{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.pri{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.pri:hover{color:#000;filter:brightness(1.12)}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--dim)}.amb{color:var(--amber)}
.bgp{background:var(--green)}.bgn{background:var(--red)}.bgd{background:var(--line2)}.bgm{background:var(--dim)}
.r{text-align:right}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--amber)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.acts,.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{padding:14px 0}

.g{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card.gap{margin-bottom:12px}
.h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.h::before{content:'> ';color:var(--dim)}
.k{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.rowh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.empty{margin-bottom:12px;border-color:var(--amber)}
.empty p+p{margin-bottom:12px}

.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.s0{stroke:var(--line2)}.sg{stroke:var(--green)}.sr{stroke:var(--red)}.sd{stroke:var(--dim)}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lg{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lg em{font-style:normal;color:var(--dim);text-align:right}
.dot{display:inline-block;width:7px;height:7px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.ev.rule{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.hb{height:20px;background:#111;margin:2px 0 10px}
.hb i{display:block;height:100%}
.sec{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.sec.first{border:0;margin-top:0;padding-top:0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.9fr);gap:4px}
.dw{font-size:11px;color:var(--dim);text-align:center;padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cd{min-height:66px;padding:6px;border:1px solid var(--line);background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;letter-spacing:0;color:var(--dim);overflow:hidden}
.cd b{font-size:12px}.cd em{font-style:normal;font-size:10px}
.cd.we,.cd.off{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cd.off{border-color:transparent;opacity:.5}
.cd.p{background:rgba(51,255,102,.07);border-color:rgba(51,255,102,.3)}
.cd.n{background:rgba(255,69,69,.08);border-color:rgba(255,69,69,.3)}
.cd.z{border-color:var(--line2)}
.cd.now span{color:var(--amber)}
.cd.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cd.wk{border-style:dashed}
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}

.eqs{display:flex;gap:22px;flex-wrap:wrap}
.eqs div{display:flex;flex-direction:column;gap:2px}
.chart{display:block;width:100%;height:160px}
.cap{font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.04em}
.chart *{vector-effect:non-scaling-stroke}
.chart .ln{fill:none;stroke-width:1.5}
.chart .z{stroke:var(--line2);stroke-dasharray:4 4}
.chart .mb{fill:none;stroke:var(--dim);stroke-width:1.5;stroke-dasharray:5 4}.chart .ma{fill:none;stroke:var(--green);stroke-width:2}
.bga{background:var(--amber)}
.hl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px}
.cg .ln{stroke:var(--green)}.cg .ar{fill:rgba(51,255,102,.1)}
.cr .ln{stroke:var(--red)}.cr .ar{fill:rgba(255,69,69,.1)}
.fp{fill:var(--green)}.fn{fill:var(--red)}.fa{fill:var(--amber)}
/* cross-filters: anything with .pick narrows every card and the log; the filters show as chips under the bar */
.pick{cursor:pointer}.pick:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.lg.pick,.ev.pick{margin:0 -6px;padding-left:6px;padding-right:6px}.lg.pick:hover,.ev.pick:hover,.hb.pick:hover{background:#121212}
.lg.on,.ev.on{background:#1a1406;box-shadow:inset 2px 0 0 var(--amber)}
tr.pick:hover td{background:#121212}tr.on td{background:#1a1406}tr.on td:first-child{box-shadow:inset 2px 0 0 var(--amber)}
.hb.off i{opacity:.25}
.gauge path.pick:hover{filter:brightness(1.3)}.gauge path.off,.chart .off{opacity:.25}
.chart rect.pick:hover{filter:brightness(1.35)}.chart .hit{fill:transparent}.chart .hit:hover{fill:rgba(255,176,0,.08)}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.xf span{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.xf button{border-color:var(--amber);color:var(--amber);padding:5px 8px}.xf button b{font-weight:600}.xf .clr{border-color:var(--line2);color:var(--dim)}
.nd{height:160px;display:grid;place-items:center;color:var(--dim);letter-spacing:.14em;font-size:11px}
.radar{display:block;width:100%;max-width:230px;margin:0 auto}
.radar .rg{fill:none;stroke:var(--line2)}
.radar .rv{fill:rgba(255,176,0,.16);stroke:var(--amber);stroke-width:1.5}
.radar text{fill:var(--dim);font:10px var(--f);letter-spacing:.08em}

.tw{overflow-x:auto;position:relative}
table{width:100%;min-width:980px;border-collapse:collapse}
table.sm{min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
th.r,td.r{text-align:right}
td button{padding:2px 7px;font-size:11px}
footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:11px;color:var(--dim)}
footer button{padding:3px 8px;font-size:11px}
footer p{flex-basis:100%}

dialog{background:var(--panel);color:var(--tx);border:1px solid var(--amber);padding:20px;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.78)}
dialog h3{margin:0 0 14px;font-size:13px;letter-spacing:.14em;color:var(--amber)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fgrid>button{align-self:end}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
label input,label select,label textarea,dialog textarea{width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
textarea{resize:vertical}
.fa2{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.fa2>span{margin-right:auto}
/* guided session */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.chips input{width:84px}
.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin:4px 0 12px}
.rate button{padding:8px 0}
.rate .on,.chips .on{background:var(--amber);border-color:var(--amber);color:#000}
.bub{position:relative;width:260px;max-width:100%;aspect-ratio:1;margin:18px auto 8px}
.bub svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.bub circle{fill:none;stroke-width:2}.bub .rt{stroke:var(--line2)}.bub .rp{stroke:var(--amber);stroke-linecap:round}
.ball{position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(255,176,0,.55);background:radial-gradient(circle at 50% 42%,rgba(255,176,0,.34),rgba(255,176,0,.07) 68%,transparent);box-shadow:0 0 40px rgba(255,176,0,.12);transform:scale(.45);will-change:transform}
.cue{position:absolute;inset:0;display:grid;place-content:center;gap:4px;text-align:center;color:var(--amber);letter-spacing:.24em;font-weight:600}
.cue em{font-style:normal;font-size:28px;letter-spacing:0;color:var(--tx)}
.clock{font-size:22px;font-weight:600;text-align:center;margin-bottom:4px;letter-spacing:.04em}
.held .ball{opacity:.45}.held .cue,.clock.held{color:var(--dim)}
.c{text-align:center}
.cue small{font-size:10px;color:var(--dim);letter-spacing:.2em}
.gp{text-align:center;min-height:3em;margin:4px 0 10px;font-size:14px;line-height:1.5;color:var(--tx)}
.rv textarea{width:100%;margin-bottom:10px;font-size:14px}
.ball.flame{inset:70px 92px 40px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;border:0;background:radial-gradient(ellipse at 50% 70%,#fff3c4 0,#ffb000 38%,rgba(255,90,0,.35) 70%,transparent 72%);box-shadow:0 0 60px rgba(255,150,0,.35);animation:fl 2.6s ease-in-out infinite}
@keyframes fl{0%,100%{filter:brightness(1)}40%{filter:brightness(1.18)}55%{filter:brightness(.9)}}
.ball.pin{inset:108px;border:0;background:var(--amber);box-shadow:0 0 24px rgba(255,176,0,.5)}
label.ck{flex-direction:row;align-items:center;gap:8px;margin:2px 0 8px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--tx)}
label.ck input{width:auto}
[hidden]{display:none!important}
/* daily review: a script to read top to bottom (scoped to the dialog: .rv is also the live session screen) */
dialog.rvd{width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rvh h3{margin:0;flex:1}
.rvd .rv{border-top:1px solid var(--line);padding:14px 0 4px;font-size:14px;line-height:1.7}
.rvd .rv h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rvd .rv p{margin:0 0 8px}.rvd .rv b{font-weight:600}.rvd .rv q{color:var(--dim);font-style:italic}
.rvd .rv ol,.rvd .rv ul{margin:0 0 8px;padding-left:22px}.rvd .rv li{margin:0 0 6px}.rvd .rv li::marker{color:var(--dim)}
.rvd .rv .tr{display:block;color:var(--dim);font-size:12px}
.rvd .rv blockquote{margin:0 0 8px;padding:2px 0 2px 12px;border-left:2px solid var(--amber);white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--panel);border:1px solid var(--amber);color:var(--amber);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fgrid{grid-template-columns:1fr}
  .cd{min-height:50px;padding:3px}.cd em{display:none}.cd b{font-size:10px}
  .eqs{gap:14px}
  .rate{grid-template-columns:repeat(5,minmax(0,1fr))}
}
/* ---------- session sheet: the start, live and done screens of a session ----------
   Full screen on a phone (a centred sheet on wide screens) with no hard frame and a soft amber glow behind the
   bubble. It slides up when it opens and each step fades in, so start -> live -> done flows instead of jumping. */
dialog.ss{position:fixed;inset:0;width:100%;max-width:none;height:100%;max-height:none!important;margin:0;border:0;
  padding:calc(env(safe-area-inset-top) + 18px) 20px 0;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(90% 42% at 50% 30%,rgba(255,176,0,.07),transparent 72%),var(--bg);
  animation:ssIn .4s cubic-bezier(.2,.8,.2,1)!important}
dialog.ss::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@keyframes ssIn{from{opacity:0;transform:translateY(32px)}}
@keyframes ssFade{from{opacity:0;transform:translateY(6px)}}
dialog.ss>*{display:flex;flex-direction:column;min-height:100%;max-width:520px;margin:0 auto;animation:ssFade .3s ease both}
dialog.ss h3{align-self:center;text-align:center;font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--dim);margin:4px 0 24px}
/* start screen: room to breathe, one family of chips, the action pinned to the bottom */
dialog.ss .chips{gap:8px;margin:6px 0 20px}
dialog.ss .chips button{padding:9px 12px}
dialog.ss .chips button,dialog.ss .rate button{transition:background-color .18s,border-color .18s,color .18s}
dialog.ss .rate{gap:6px;margin:6px 0 20px}
dialog.ss .rate button{padding:10px 0}
dialog.ss label{margin-bottom:6px}
dialog.ss .fa2{position:sticky;bottom:0;z-index:2;margin:auto -20px 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);
  background:linear-gradient(rgba(7,7,7,0),var(--bg) 40%);display:flex;gap:10px}
dialog.ss .fa2>button{flex:1;padding:14px 8px;font-size:12px;letter-spacing:.1em}
dialog.ss .fa2{flex-wrap:wrap}dialog.ss .fa2>span{flex:1 0 100%;text-align:center;font-size:11px;color:var(--dim)}dialog.ss .fa2>span:empty{display:none}
dialog.ss .fa2>.ghost{flex:0 0 auto;border-color:transparent;background:none;color:var(--dim)}
/* live: the bubble is the screen, centred, with a large quiet clock */
dialog.ss>*:has(>.bub)>.bub{margin-top:auto}
dialog.ss .bub{width:min(76vw,330px);margin:8px auto 22px}
dialog.ss .bub .rt{stroke:rgba(255,255,255,.07)}
dialog.ss .ball{box-shadow:0 0 90px rgba(255,176,0,.16),inset 0 0 40px rgba(255,176,0,.06);transition:opacity .5s}
dialog.ss .cue{letter-spacing:.28em;font-size:12px}
dialog.ss .cue em{font-size:36px;font-weight:300}
dialog.ss .clock{font-size:48px;font-weight:300;letter-spacing:.02em;margin:0 0 6px;font-variant-numeric:tabular-nums;transition:color .3s}
dialog.ss .gp{font-size:15px;line-height:1.6;max-width:32ch;margin:0 auto 12px;color:#cfcabd;transition:opacity .3s}
dialog.ss p.c{font-size:12px;margin:0 0 8px}
@media(min-width:700px){dialog.ss{inset:0;margin:auto;width:min(620px,calc(100% - 48px));height:min(900px,calc(100% - 48px));border:1px solid var(--line2)}}
@media(prefers-reduced-motion:reduce){dialog.ss,dialog.ss>*{animation:none!important}}
/* choices in a session read as a list, like the live workout's exercises: a dot (a box when you can pick several),
   the name, a detail on the right. Short sets of options are one segmented bar. */
dialog.ss .vl{display:flex;flex-direction:column;gap:0;margin:6px 0 20px;border-top:1px solid var(--line)}
dialog.ss .vl button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13px;letter-spacing:0;color:var(--tx);transition:background-color .18s,color .18s}
dialog.ss .vl button::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;border:1px solid var(--line2);transition:background-color .18s,border-color .18s,box-shadow .18s}
dialog.ss .vl button.on{color:var(--amber);background:rgba(255,176,0,.06)}
dialog.ss .vl button.on::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,0,.6)}
dialog.ss .vl.multi button::before{width:14px;height:14px;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:600;line-height:1;color:#000}
dialog.ss .vl.multi button.on::before{content:'✓';box-shadow:none}
dialog.ss .vl button:hover{color:var(--amber)}
dialog.ss .vl em{margin-left:auto;font-style:normal;font-size:11px;color:var(--dim);text-align:right}
dialog.ss .vl button.on em{color:var(--amber)}
dialog.ss .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:6px 0 20px;border:1px solid var(--line2)}
dialog.ss .seg button{border:0;border-right:1px solid var(--line2);padding:11px 2px;text-align:center;background:none;font-size:12px;transition:background-color .18s,color .18s}
dialog.ss .seg button:last-child{border-right:0}
dialog.ss .seg button.on{background:var(--amber);color:#000}
h1.brand{margin:0}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">ISIONXXX <b>//</b> MIND<i class="cur"></i></h1>
  <div class="acts">
    <button class="pri" data-a="go">&#9654; START</button>
    <button data-a="add">+ LOG</button>
    <button data-a="imp">IMPORT</button>
    <button data-a="review">REVIEW</button>
    <button data-a="note">NOTES</button>
    <button data-a="set">SETTINGS</button>
    <input id="file" type="file" accept=".csv,.json,text/csv,application/json" hidden>
  </div>
</header>
<div id="top"></div>
<div class="bar">
  <select data-f="kind" aria-label="Practice"></select>
  <select data-f="stat" aria-label="Outcome">
    <option value="all">All moods</option><option value="up">Felt better</option><option value="same">Felt the same</option><option value="down">Felt worse</option>
  </select>
  <select data-f="range" aria-label="Range"></select>
  <span id="scope" class="dim"></span>
</div>
<div id="xf" class="xf" hidden></div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="sync.js" data-keys="isx.mind.v1"></script>
<script src="ui.js"></script>
<script>
'use strict';
const KEY='isx.mind.v1', RUN='isx.mind.run', PAGE=20;
const RANGES={today:'Today',week:'This week',month:'This month',all:'All time'};
const KIND={M:'Meditation',B:'Breathwork',S:'Body Scan',V:'Visualization',F:'Focus',J:'Journaling'};
const KDESC={M:'Sit with the breath',B:'Paced breathing',S:'Relax part by part',V:'Rehearse it first',F:'One point, steady',J:'Write it out'};
const TECH={
  M:['Breath counting','Open awareness','Noting'],
  B:['Box 4-4-4-4','Resonance 5.5','Physiological sigh','4-7-8'],
  S:['NSDR','Progressive relaxation','Head to toe'],
  V:['Session rehearsal','Process','Outcome'],
  F:['Single-point','Counting','Candle'],
  J:['Evening review','Morning pages','Gratitude','Free write']
};
// breath pacer for the guided timer: [cue, seconds]
const PACE={
  'Box 4-4-4-4':[['INHALE',4],['HOLD',4],['EXHALE',4],['HOLD',4]],
  'Resonance 5.5':[['INHALE',5.5],['EXHALE',5.5]],
  'Physiological sigh':[['INHALE',2],['TOP UP',1],['EXHALE',6]],
  '4-7-8':[['INHALE',4],['HOLD',7],['EXHALE',8]]
};
// everything without its own pattern breathes slow and easy: 4 in, 6 out
const CALM=[['INHALE',4],['EXHALE',6]];
const ALIAS={
  at:['date','when','datetime','timestamp','time (local)','start time','started at'],
  kind:['practice','type','kind','activity','category'],
  tech:['technique','method','preset'],
  mins:['minutes','mins','duration','duration_min','length'],
  pre:['before','state before','pre','mood before'],
  post:['after','state after','post','mood after'],

/* ---------- state ---------- */
let S=load();
const U={kind:'all',stat:'all',range:'all',page:0,month:null,x:{}};   // x: cross-filters set by clicking a card (tod, wk, run); practice and mood use U.kind and U.stat
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.log))return {log:s.log,notes:s.notes||{},goal:s.goal||70}}catch(e){}

function setMonth(ms){const d=new Date(ms);U.month={y:d.getFullYear(),m:d.getMonth()}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

// shift = state after - state before. Sessions without both ratings still count for time and streaks.
// skip leaves filters out (comma-separated): a card that sets a filter shows everything else, with its own choice highlighted
const mood=d=>d==null?null:d>0?'up':d<0?'down':'same';
function view(useRange=true,skip=''){
  const today=ymd(new Date()),wk=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
  const inR=d=>U.range==='all'||(U.range==='today'?d===today:U.range==='week'?wk(d)===wk(today):U.range==='month'?d.slice(0,7)===today.slice(0,7):d===U.range);
  const x=U.x,sk=skip.split(','),on=k=>!sk.includes(k)&&x[k]!=null;
  let T=S.log.map(e=>({...e,day:ymd(new Date(e.at)),d:e.pre!=null&&e.post!=null?r2(e.post-e.pre):null}))
    .filter(e=>(sk.includes('kind')||U.kind==='all'||e.kind===U.kind)&&(sk.includes('stat')||U.stat==='all'||mood(e.d)===U.stat)&&(!useRange||inR(e.day))
      &&(!on('tod')||tod(e.at)===x.tod)&&(!on('wk')||wkStart(e.at)===x.wk));
  // a streak: the days of the current or the best run, found over every day the other filters leave (any range)
  if(on('run')){const days=runs(view(false,skip+',run').map(e=>e.day))[x.run];T=T.filter(e=>days.has(e.day))}
  return T.sort((a,b)=>a.at-b.at);

// runs of consecutive practice days: the current one (alive until a full day is missed) and the best (latest if tied)
function runs(days){
  const dk=[...new Set(days)].sort();let a=0,best=[0,0];
  dk.forEach((k,i)=>{if(i&&dd(dk[i-1],k)!==1)a=i;if(i+1-a>=best[1]-best[0])best=[a,i+1]});
  const end=dk[dk.length-1],cur=end&&dd(end,ymd(new Date()))<=1?dk.slice(a):[];
  return {now:new Set(cur),best:new Set(dk.slice(...best))};
}

function stats(T,end){
  const C=T.filter(e=>e.d!=null),n=C.length,W=C.filter(e=>e.d>0),L=C.filter(e=>e.d<0);
  const gp=r2(W.reduce((s,e)=>s+e.d,0)),gl=r2(-L.reduce((s,e)=>s+e.d,0)),tot=r2(gp-gl);
  const D={};T.forEach(e=>{D[e.day]??={d:0,n:0,m:0};D[e.day].d+=e.d||0;D[e.day].n++;D[e.day].m+=e.mins});
  const dk=Object.keys(D).sort(),dp=dk.map(k=>r2(D[k].d)),has=new Set(dk);
  let eq=0,peak=0,mdd=0,run=0,lw=0,ll=0;const curve=[0],under=[0];
  C.forEach(e=>{

    const s=Math.sign(e.d);run=!s?0:Math.sign(run)===s?run+s:s;lw=Math.max(lw,run);ll=Math.max(ll,-run);

  let ds=0,dsMax=0,dsCur=0;dk.forEach((k,i)=>{ds=i&&dd(dk[i-1],k)===1?ds+1:1;dsMax=Math.max(dsMax,ds)});
  const c=pd(ymd(new Date()));if(!has.has(ymd(c)))c.setDate(c.getDate()-1);
  while(has.has(ymd(c))){dsCur++;c.setDate(c.getDate()-1)}

  const last=dk[dk.length-1],span=dk.length?dd(dk[0],end&&end>last?end:last)+1:0,cons=span?dk.length/span*100:0;
  const aw=W.length?gp/W.length:0,al=L.length?gl/L.length:0,pf=gl?gp/gl:gp?Infinity:null,wr=n?W.length/n*100:0;
  // score axes, each 0-100: consistency, lift rate, shift factor (2.0 = full)
  const axes=[cons,wr,Math.min((pf||0)/2,1)*100],Q=T.filter(e=>e.depth!=null);
  return {total:T.length,n,w:W.length,l:L.length,be:n-W.length-L.length,gp,gl,tot,aw,al,pf,wr,exp:n?tot/n:0,
    best:n?Math.max(...C.map(e=>e.d)):0,worst:n?Math.min(...C.map(e=>e.d)):0,
    dk,dp,vol:dk.map(k=>D[k].m),dw:dp.filter(x=>x>0).length,dl:dp.filter(x=>x<0).length,
    avgDay:dp.length?dp.reduce((a,b)=>a+b,0)/dp.length:0,mdd:r2(mdd),lw,ll,run,curve,under,axes,
    score:Math.round((axes[0]+axes[1]+axes[2])/3),last5:C.slice(-5),dsMax,dsCur,span,cons,
    mins:T.reduce((s,e)=>s+e.mins,0),depth:Q.length?Q.reduce((s,e)=>s+e.depth,0)/Q.length:null,
    pre:n?C.reduce((s,e)=>s+e.pre,0)/n:0,post:n?C.reduce((s,e)=>s+e.post,0)/n:0};
}
function byKind(T){

  T.forEach(e=>{const g=G[e.kind]??={n:0,m:0,c:0,d:0,w:0,q:0,qn:0};g.n++;g.m+=e.mins;
    if(e.d!=null){g.c++;g.d+=e.d;if(e.d>0)g.w++}if(e.depth!=null){g.q+=e.depth;g.qn++}});
  return Object.entries(G).map(([k,g])=>({k,...g,avg:g.c?g.d/g.c:null})).sort((a,b)=>(b.avg??-99)-(a.avg??-99));

/* ---------- svg ---------- */
const ARC='M12 62A50 50 0 0 1 112 62', ND='<div class="nd">NO DATA_</div>';
// a segment can carry a cross-filter (f = 'key:value'): click it to filter, and it stays bright while the others dim
function gauge(segs,label){
  let off=0;
  const arcs=segs.map(([v,c,f,t])=>{const a=`<path class="${c}${f?' pick'+(xoff(f)?' off':''):''}" d="${ARC}" pathLength="100" stroke-dasharray="${(v*100).toFixed(2)} 100" stroke-dashoffset="${(-off*100).toFixed(2)}"${f?` data-a="xf" data-v="${f}"`:''}>${t?`<title>${esc(t)}</title>`:''}</path>`;off+=v;return a}).join('');
  return `<svg class="gauge" viewBox="0 0 124 70"><path class="s0" d="${ARC}"/>${arcs}<text x="62" y="60" text-anchor="middle">${label}</text></svg>`;
}
// a chart is ~600 px wide: more points than that only costs time and memory. Keep each bucket's low and high, in
// order, so peaks and drawdowns still show.
// long ranges: average runs of k neighbours so every bar or point stays readable on a phone (the newest run ends
// on the latest value). Returns the values and k, so the chart can say what one bar stands for.
function bucket(v,max){const n=v.length;if(n<=max)return{v,k:1,r:v.map((_,i)=>[i,i+1])};const k=Math.ceil(n/max),o=[],r=[];for(let e=n;e>0;e-=k){const a=Math.max(0,e-k),s=v.slice(a,e);o.unshift(s.reduce((a,x)=>a+(+x||0),0)/s.length);r.unshift([a,e])}return{v:o,k,r}}
const cap=(k,what='days')=>k>1?`<div class="cap">Each bar averages ${k} ${what}</div>`:'';
function line(vals,c){
  vals=bucket(vals,120).v;
  const w=600,h=160,p=6,n=vals.length;if(n<2)return ND;
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=hi-lo||1;
  const x=i=>(p+i*(w-2*p)/(n-1)).toFixed(1),y=v=>(p+(hi-v)*(h-2*p)/rg).toFixed(1);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg class="chart ${c}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon class="ar" points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}"/><line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/><polyline class="ln" points="${pts}"/></svg>`;
}
// at(i0,i1) → {a, title} for the stretch of points one column stands for: what clicking it does, what hovering says
// the click areas are paths, not rects, so UI.animate's bar growth leaves them alone
const hit=m=>m?`${m.a?` class="hit pick" ${m.a}`:' class="hit"'}><title>${esc(m.title)}</title></path>`:' class="hit"/>';

function bars0(vals,signed,at){
  const w=600,h=160,p=6,n=vals.length;if(!n)return ND;
  const lo=Math.min(0,...vals),hi=Math.max(0,...vals),rg=hi-lo||1,step=(w-2*p)/n,bw=Math.min(180,step*.7);
  const y=v=>p+(hi-v)*(h-2*p)/rg;

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${vals.map((v,i)=>{const m=at&&at(i);return `<rect class="${signed?(v<0?'fn':'fp'):'fa'}${m&&m.off?' off':''}" x="${(p+i*step+(step-bw)/2).toFixed(1)}" y="${Math.min(y(0),y(v)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y(v)-y(0))).toFixed(1)}"/>`+(m?`<path d="M${(p+i*step).toFixed(1)} 0h${step.toFixed(1)}v${h}h-${step.toFixed(1)}z"${hit(m)}`:'')}).join('')}<line class="z" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/></svg>`;

function radar(ax){
  const cx=100,cy=92,R=68,ang=[-90,30,150].map(a=>a*Math.PI/180);
  const pt=(i,f)=>`${(cx+Math.cos(ang[i])*R*f).toFixed(1)},${(cy+Math.sin(ang[i])*R*f).toFixed(1)}`;

function calendar(){
  const D={};view(false).forEach(e=>{D[e.day]??={d:0,n:0,m:0};D[e.day].d+=e.d||0;D[e.day].n++;D[e.day].m+=e.mins});
  const {y,m}=U.month,lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((lead+dim)/7),today=ymd(new Date());
  const cell=(p,mm)=>`<b class="${cls(p)}">${sg(p,1)}</b><em>${hm(mm)}</em>`;
  let h='',tot=0,nT=0,mT=0,wd=0,ld=0,td=0;

const TOD=[['Morning',5,12],['Afternoon',12,17],['Evening',17,22],['Night',22,29]];

// singing-bowl strike: a low fundamental with inharmonic partials and a long tail; n strikes a few seconds apart
function bell(n=1,soft){
  try{
    AC??=new (window.AudioContext||window.webkitAudioContext)();AC.resume();
    for(let i=0;i<n;i++){const t=AC.currentTime+i*2.6,v=soft?.06:.14;
      [[220,1],[220*2.76,.45],[220*5.4,.18]].forEach(([f,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.015);g.gain.exponentialRampToValueAtTime(1e-4,t+(soft?3:6));
        o.connect(g).connect(AC.destination);o.start(t);o.stop(t+6)})}
  }catch(e){}
}

function breath(ms){
  const P=PACE[R.tech]||CALM;let x=ms/1000%P.reduce((a,p)=>a+p[1],0),s=.45;
  for(const[c,d]of P){
    const to=c==='INHALE'?1:c==='TOP UP'?1.1:c==='EXHALE'?.45:s;
    if(x<d)return {c,left:Math.ceil(d-x),s:s+(to-s)*(1-Math.cos(Math.PI*x/d))/2};
    x-=d;s=to;
  }
  return {c:'',left:0,s};
}

function runView(){

  const stepLen=()=>R.target&&S1.length?R.target*60000/S1.length:90000;
  const tick=()=>{

    if(R.paused){if($('#pc'))$('#pc').innerHTML='PAUSED';return}

    if(i!==R.pi){if(R.pi>=0||m==='guide')bell(1,1);R.pi=i;keepRun();if(m==='guide')say(S1[i])}

  const anim=()=>{
    const b=$('#ball');if(!R||R.done!=null||!b)return;
    const s=m==='breath'||settling()?breath(elapsed()).s:.72+.1*Math.sin(elapsed()/12000*2*Math.PI);
    b.style.transform=`scale(${s.toFixed(3)})`;RA=requestAnimationFrame(anim);
  };
  cancelAnimationFrame(RA);RA=requestAnimationFrame(anim);
  if(m==='write')$('#jn').oninput=e=>{R.note=e.target.value;keepRun()};

}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  const end=()=>{row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;end()}else f+=c}
  end();return rows;
}
// date-only values are read as local noon so they never slip to the previous day
const ts=s=>Date.parse(/^\d{4}-\d\d-\d\d$/.test(s)?s+'T12:00':/^\d{4}-\d\d-\d\d \d/.test(s)?s.replace(' ','T'):s);

  if(add){save();setMonth(last);render()}
  toast(`Imported ${add} · skipped ${skip}`);
}

  if(wm>=S.goal&&wb<S.goal)good.push(`This day took me past my weekly goal of ${hm(S.goal)}.`);
  if(morn.length)good.push(`I practiced in the morning (${ck(morn[0].at)}), before the day got going.`);
  if(R.length>=2&&!flat.length)good.push(`Every rated session left me feeling better.`);
  if(dep!=null&&dep>=7)good.push(`${Q.length>1?'Deep sessions: an average depth of':'A deep session: depth'} ${n1(dep)}/10.`);
  if(flat.length)look.push(`${flat.length===1?'One session':pl(flat.length,'session')} left me the same or worse: ${flat.map(e=>`${name(e)} at ${ck(e.at)}, ${mood(e)}`).join('; ')}.`);
  if(short.length)look.push(`${short.length===1?'A very short session':pl(short.length,'very short session')}: ${short.map(e=>`${mn(e.mins)} of ${name(e)}`).join(', ')}. Fine as a reset, but it is hard to settle in under 5 minutes.`);
  if(shallow.length)look.push(`Low depth on ${and(shallow.map(e=>`${name(e)} (${e.depth}/10)`))}. What got in the way?`);
  if(gap>1)look.push(`No practice the day before: my last ${U.kind==='all'?'':KIND[U.kind]+' '}session was ${gap===2?'two days':`${gap} days`} earlier, on ${dlabel(last)}, so the streak started over.`);
  if(low)look.push(`My ${R.length>1?'average ':''}shift today (${sg(shift,1)}) was below my usual (${sg(as,1)}).`);
  out+=sec('What went well',good.length?`<ul>${good.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>Nothing stands out in the numbers. Showing up still counts.</p>');
  out+=sec('What to look at',look.length?`<ul>${look.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>No warning signs in the numbers.</p>');
  // the morning check-in for this date, when there is one
  let ci=null;try{ci=(JSON.parse(localStorage.getItem('isx.checkin.v1'))?.log||[]).find(e=>e.day===day)}catch(e){}
  if(ci){const Qs=['','poor','restless','OK','good','great'],E=['','drained','low','steady','good','charged'];
    out+=sec('My state',`<p>I slept <b>${ci.sleep} h</b> (${Qs[ci.q]||'—'} sleep) and my energy was <b>${E[ci.energy]||'—'}</b>.${ci.sleep<7&&low?' Short sleep and a smaller lift than usual: worth watching if it repeats.':''}</p>`)}
  out+=sec('My notes',S.notes[day]?`<blockquote>${esc(S.notes[day])}</blockquote>`:'<p>No notes for this day yet.</p>');
  // questions, most specific first
  const q=['How did I feel an hour after practicing? Did the calm last?'];
  if(flat.length)q.push(`What was going on just before ${name(flat[0])} at ${ck(flat[0].at)}?`);
  if(shallow.length)q.push(`What pulled my attention during ${name(shallow[0])}, and what would help next time?`);
  if(gap>1)q.push('What got in the way of practicing the day before?');
  if(best)q.push(`What made ${name(best)} work today? Could I set that up again tomorrow?`);
  if(!morn.length)q.push('Could a short session fit in tomorrow morning?');
  if(wm<S.goal&&ymd(new Date(wkStart(Date.now())))===ymd(new Date(w0)))q.push(`Where will the ${mn(S.goal-wm)} left for my weekly goal fit in?`);
  q.push('One thing to keep doing tomorrow. One thing to change.');
  out+=sec('Questions to answer',`<ol>${q.map(x=>`<li>${x}</li>`).join('')}</ol>`);
  return out;
}
function reviewForm(day){
  const D=rvDays();if(!D.length)return toast('No sessions to review yet');
  day=D.includes(day)?day:rvDefault();const i=D.indexOf(day);
  dlg.classList.add('rvd');dlg.addEventListener('close',()=>dlg.classList.remove('rvd'),{once:true});
  dlg.innerHTML=`<div class="rvh"><h3>DAILY REVIEW // ${dlabel(day).toUpperCase()}</h3>
    <button type="button" data-a="rvgo" data-v="${D[i-1]||''}" ${i>0?'':'disabled'} aria-label="Previous practice day">&lt;</button><button type="button" data-a="rvgo" data-v="${D[i+1]||''}" ${i<D.length-1?'':'disabled'} aria-label="Next practice day">&gt;</button></div>
    <div id="rvb">${review(day)}</div>
    <div class="fa2"><span><button type="button" data-a="rvcopy">COPY</button></span><button type="button" data-a="rvnote" data-v="${day}">WRITE NOTES</button><button type="button" class="pri" data-a="x">DONE</button></div>`;
  if(!dlg.open)dlg.showModal();
  dlg.querySelector('#rvb').scrollTop=0;dlg.scrollTop=0;
}
// plain text of the review, for pasting into a notes app
function reviewText(){
  const b=$('#rvb');if(!b)return '';
  return [dlg.querySelector('.rvh h3').textContent,...[...b.querySelectorAll('.rv')].map(x=>[x.querySelector('h4').textContent.toUpperCase(),
    ...[...x.children].slice(1).map(el=>el.matches('ol,ul')?[...el.children].map((li,i)=>`${el.matches('ol')?i+1+'.':'-'} ${li.textContent.replace(/\s+/g,' ').trim()}`).join('\n'):el.textContent.trim())].join('\n'))].join('\n\n');
}

/* ---------- settings: everything that used to sit in the footer, behind the header's SETTINGS button ---------- */
function settingsForm(){
  dlg.innerHTML=`<h3>SETTINGS</h3>
  <div class="ui-set">
    <div><span><b>Weekly goal</b><small>Mindful minutes a week</small></span><select data-f="goal" aria-label="Weekly goal">${[35,70,105,140,210,300].map(v=>`<option value="${v}"${v===S.goal?' selected':''}>${hm(v)}</option>`).join('')}</select></div>
    <div><span><b>Sync</b><small>${window.ISXSync?.state==='ok'?'On · this app syncs across your devices':'Keep every app the same on all your devices'}</small></span><span class="ui-set-btns"><button type="button" data-a="sync">SYNC…</button></span></div>
    <div><span><b>Backup</b><small>Saved on this device. Download a copy, or restore one.</small></span><span class="ui-set-btns"><button type="button" data-a="bak">BACKUP JSON</button><button type="button" data-a="imp">RESTORE</button></span></div>
    <div><span><b>Delete everything</b><small>Removes all of this app's data on this device.</small></span><span class="ui-set-btns"><button type="button" class="ui-danger" data-a="clear">CLEAR ALL</button></span></div>
  </div>
  <div class="fa2"><button type="button" class="pri" data-a="x">DONE</button></div>`;
  dlg.showModal();
}
const ACT={
  set:()=>settingsForm(),sync:()=>{dlg.close();document.getElementById('isx-sync')?.click()},
  add:()=>entryForm(),go:()=>R?(R.done==null?runView():wrapForm()):startForm(),imp:()=>$('#file').click(),x:()=>dlg.close(),sample,csv:exportCSV,
  note:()=>noteForm(U.range in RANGES?ymd(new Date()):U.range),
  review:()=>reviewForm(rvDefault()),rvgo:v=>v&&reviewForm(v),rvnote:v=>{dlg.classList.remove('rvd');noteForm(v)},
  rvcopy:()=>{const t=reviewText();(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Review copied'),()=>toast('Copy failed — select the text instead'))},
  bak:()=>dl(`mind-backup-${ymd(new Date())}.json`,JSON.stringify(S),'application/json'),
  clear:()=>{if(confirm('Delete ALL sessions and notes on this device?')){S={log:[],notes:{},goal:S.goal||70};save();U.range='all';boot()}},
  prev:()=>shift(-1),next:()=>shift(1),tod:()=>{setMonth(Date.now());render()},
  day:v=>{U.range=U.range===v?'all':v;U.page=0;render()},
  rng:v=>{U.range=U.range===v?'all':v;U.page=0;render()},   // the Today card's period tiles; tap again for all time
  xf:v=>{const i=v.indexOf(':'),k=v.slice(0,i);let x=v.slice(i+1);if(k==='wk')x=+x;
    if(k==='kind'||k==='stat')U[k]=U[k]===x?'all':x;else if(U.x[k]===x)delete U.x[k];else U.x[k]=x;U.page=0;render()},
  xclr:k=>{if(k==='kind'||k==='stat'||k==='range')U[k]='all';else delete U.x[k];U.page=0;render()},
  xall:()=>{U.kind='all';U.stat='all';U.x={};if(/^\d{4}-/.test(U.range))U.range='all';U.page=0;render()},
  edit:v=>entryForm(S.log.find(t=>t.id===v)),
  del:v=>{if(confirm('Delete this session?')){S.log=S.log.filter(t=>t.id!==v);save();render()}},
  pp:()=>{U.page--;render()},pn:()=>{U.page++;render()}
};
function shift(k){const d=new Date(U.month.y,U.month.m+k,1);U.month={y:d.getFullYear(),m:d.getMonth()};render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v)});
// rows that act as buttons (cross-filters) answer Enter and Space too, and keep focus after the redraw
document.addEventListener('keydown',e=>{const b=e.target.closest('[role=button][data-a]');if(!b||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();
  const sel=`[data-a="${b.dataset.a}"][data-v="${CSS.escape(b.dataset.v||'')}"]`,i=[...document.querySelectorAll(sel)].indexOf(b);b.click();document.querySelectorAll(sel)[i]?.focus()});
document.addEventListener('change',e=>{const k=e.target.dataset.f;if(!k)return;if(k==='goal'){S.goal=+e.target.value;save();return render()}U[k]=e.target.value;U.page=0;render()});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const txt=await f.text();
  if(!/\.json$/i.test(f.name))return importCSV(txt);
  try{
    const s=JSON.parse(txt);if(!Array.isArray(s.log))throw 0;
    if(!confirm(`Replace everything here with this backup (${s.log.length} sessions)?`))return;
    S={log:s.log,notes:s.notes||{},goal:s.goal||70};save();boot();toast('Backup restored');
  }catch(x){toast('Not a valid backup file')}
});

function boot(){setMonth(S.log.length?Math.max(...S.log.map(t=>t.at)):Date.now());render()}
boot();
if(R)R.done==null?runView():wrapForm();
// a session logged from another app (REWIRE) lands in storage while this page is open: pick it up instead of overwriting it
addEventListener('storage',e=>{if(e.key===KEY){S=load();render()}});
// another ISIONXXX app can send you straight to an action here (REWIRE's LOG buttons): #do=<action> or a message
// 'today' (from TODAY's rings and timeline): drop any card filters and show just today, as a chip you can clear
function doAct(a){if(!/^\w+$/.test(a||''))return;if(a==='today'){U.x={};U.range=ymd(new Date());setMonth(Date.now());U.page=0;render();return}const b=document.querySelector(`[data-a="${a}"],[data-act="${a}"]`);if(b)b.click()}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.isx==='do')doAct(e.data.act)});
{const m=/do=(\w+)/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>doAct(m[1]),0)}}
/* ---------- today at a glance (shared hero, timeline and motion from ui.js) ---------- */
function heroToday(){
  if(!S.log.length)return '';
  const day=ms=>ymd(new Date(ms)),t=day(Date.now()),T=S.log.filter(e=>day(e.at)===t),goal=S.goal||70,daily=Math.round(goal/7);
  // each tile is what the dashboard shows for that range (same week and month starts), with no practice, mood or card filters
  const per=k=>{const r=U.range;U.range=k;const V=view(true,'kind,stat,tod,wk,run');U.range=r;return{m:Math.round(V.reduce((a,e)=>a+e.mins,0)),n:V.length,d:new Set(V.map(e=>e.day)).size}};
  const td=per('today'),wk=per('week'),mo=per('month');
  const days=new Set(S.log.map(e=>day(e.at)));let st=0;{const d=new Date();if(!days.has(day(d)))d.setDate(d.getDate()-1);while(days.has(day(d))&&st<3650){st++;d.setDate(d.getDate()-1)}}
  const R=T.filter(e=>e.pre!=null&&e.post!=null),sh=R.length?R.reduce((a,e)=>a+e.post-e.pre,0)/R.length:null;
  const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`,mn=m=>m>=60?hm(m):`${m} min`;
  const tile=(k,label,x,sub,ok)=>({label,value:x.n?mn(x.m):'—',tone:ok?'pos':'',sub,attrs:{'data-a':'rng','data-v':k,'aria-label':`${label}: ${x.n?mn(x.m):'no sessions'}. Show ${label.toLowerCase()} below`},on:U.range===k});
  const gl=td.m>=daily?"Today's goal done ✓":`${daily-td.m} min to today's goal`;
  return UI.hero({key:'mind',title:'Today',sub:gl+(st?` · ${st}-day streak`:''),
    stats:[tile('today','Today',td,td.n?pl(td.n,'session')+(sh!=null?` · mood ${sh>0?'+':''}${Math.round(sh*10)/10}`:''):'no session yet',td.m>=daily),
      tile('week','Week',wk,wk.m>=goal?`${pl(wk.d,'day')} · goal ✓`:`${wk.m} of ${goal} goal`,wk.m>=goal),
      tile('month','Month',mo,mo.n?pl(mo.d,'day'):'no sessions yet',false)],
    action:{label:'▶ Start session',attrs:{'data-a':'go'}},
    log:T.map(e=>({at:e.at,tag:KIND[e.kind],text:`${e.tech?e.tech+' · ':''}${Math.round(+e.mins||0)} min${e.pre!=null&&e.post!=null?` · mood ${e.pre}→${e.post}`:''}`,tone:e.pre!=null&&e.post!=null?(e.post>e.pre?'pos':e.post<e.pre?'neg':''):''}))});
}
{const r0=render;render=function(...a){r0.apply(this,a);UI.animate($('#app'));UI.animate($('#top'),{onDone:l=>toast(`${l.join(' + ')} goal met ✓`)})};UI.animate($('#top'));UI.animate($('#app'))}
